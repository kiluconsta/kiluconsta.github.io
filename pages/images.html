(function(sec, IMGS) {

  const body     = sec.querySelector('.is-body');
  const lightbox = sec.querySelector('.is-lightbox');
  const lbClose  = sec.querySelector('.is-lb-close');
  const lbPrev   = sec.querySelector('.is-lb-prev');
  const lbNext   = sec.querySelector('.is-lb-next');
  const lbImg    = sec.querySelector('.is-lb-img');
  const ssBtn    = sec.querySelector('.is-btn-slideshow');
  const ssStatus = sec.querySelector('.is-ss-status');

  // ── Thumbnail URL ────────────────────────────────────────────
  // Google Photos: replace suffix → 140x140 crop.
  // Other URLs: use as-is (the tile will just show the full image scaled).
  function thumbURL(url) {
    if (/googleusercontent\.com/.test(url)) {
      return url.replace(/=[^/]+$/, '=w140-h140-c');
    }
    return url;
  }

  // ── Build tiles ──────────────────────────────────────────────
  const frag = document.createDocumentFragment();
  const insertBefore = lightbox;

  const io = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (!entry.isIntersecting) return;
      const tile = entry.target;
      const img  = tile.querySelector('img');
      if (img && !img.src) img.src = thumbURL(IMGS[+tile.dataset.index]);
      io.unobserve(tile);
    });
  }, { rootMargin: '100% 0px', threshold: 0 });

  IMGS.forEach((url, i) => {
    const tile = document.createElement('div');
    tile.className = 'is-tile';
    tile.dataset.index = i;
    const img = document.createElement('img');
    img.alt = 'Media';
    img.decoding = 'async';
    tile.appendChild(img);
    frag.appendChild(tile);
    io.observe(tile);
  });
  body.insertBefore(frag, insertBefore);

  // ── GIF duration parser ──────────────────────────────────────
  const durationCache = new Map();
  async function getGifDuration(index) {
    if (durationCache.has(index)) return durationCache.get(index);
    const FALLBACK = 6000;
    try {
      const res = await fetch(IMGS[index]);
      if (!res.ok) throw new Error('fetch failed');
      const buf  = await res.arrayBuffer();
      const data = new Uint8Array(buf);
      let totalMs = 0, frames = 0;
      for (let i = 0; i < data.length - 5; i++) {
        if (data[i] === 0x21 && data[i+1] === 0xF9 && data[i+2] === 0x04) {
          const delayCs = data[i+4] | (data[i+5] << 8);
          totalMs += delayCs * 10 || 100;
          frames++;
          i += 5;
        }
      }
      const ms = frames > 0 ? totalMs : FALLBACK;
      durationCache.set(index, ms);
      return ms;
    } catch {
      durationCache.set(index, FALLBACK);
      return FALLBACK;
    }
  }

  // ── Lightbox ─────────────────────────────────────────────────
  let idx      = 0;
  let ssActive = false;
  let ssTimer  = null;

  function cancelTimer() {
    if (ssTimer !== null) { clearTimeout(ssTimer); ssTimer = null; }
  }

  function showImage(i, fromSlideshow = false) {
    cancelTimer();
    idx = ((i % IMGS.length) + IMGS.length) % IMGS.length;
    lbImg.style.opacity = '0';
    lbImg.src = '';
    lbImg.src = IMGS[idx];
    lbImg.onload = async () => {
      lbImg.style.opacity = '1';
      if (!ssActive) return;
      ssStatus.textContent = 'timing…';
      const ms = await getGifDuration(idx);
      ssStatus.textContent = `⏱ ${(ms/1000).toFixed(1)}s`;
      if (ssActive) ssTimer = setTimeout(() => showImage(idx + 1, true), ms);
    };
  }

  function openLightbox(i) {
    lightbox.style.display = 'flex';
    showImage(i);
  }

  function closeLightbox() {
    lightbox.style.display = 'none';
    lbImg.src = '';
    stopSlideshow();
  }

  lbClose.onclick = closeLightbox;
  lbPrev.onclick  = () => showImage(idx - 1);
  lbNext.onclick  = () => showImage(idx + 1);

  body.addEventListener('click', e => {
    const tile = e.target.closest('.is-tile');
    if (tile) openLightbox(+tile.dataset.index);
  });

  function startSlideshow() {
    ssActive = true;
    ssBtn.innerHTML = '&#9724; Stop';
    showImage(idx, true);
  }
  function stopSlideshow() {
    ssActive = false;
    cancelTimer();
    ssStatus.textContent = '';
    ssBtn.innerHTML = '&#9654; Play Slideshow';
  }
  ssBtn.onclick = () => (ssActive ? stopSlideshow() : startSlideshow());

  document.addEventListener('keydown', e => {
    if (lightbox.style.display !== 'flex') return;
    if (e.key === 'ArrowRight') showImage(idx + 1);
    if (e.key === 'ArrowLeft')  showImage(idx - 1);
    if (e.key === 'Escape')     closeLightbox();
