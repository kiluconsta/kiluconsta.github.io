<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="referrer" content="no-referrer">

  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
  <link rel="icon" type="image/x-icon" href="../assets/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../assets/favicon.png">
  <link rel="apple-touch-icon" href="../assets/favicon.png">

  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#06000f">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Vault — Favourites</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="../styles.css">

  <!-- ── Thumbnail cache (IndexedDB) — shared with collection pages ── -->
  <script>
  var ThumbCache = (function() {
    var DB_NAME    = 'vault-thumbs';
    var DB_VERSION = 1;
    var STORE      = 'thumbs';
    var db         = null;

    function open(cb) {
      if (db) return cb(db);
      var req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = function(e) {
        e.target.result.createObjectStore(STORE);
      };
      req.onsuccess = function(e) {
        db = e.target.result;
        cb(db);
      };
      req.onerror = function() { cb(null); };
    }

    function get(key, cb) {
      open(function(db) {
        if (!db) return cb(null);
        try {
          var tx  = db.transaction(STORE, 'readonly');
          var req = tx.objectStore(STORE).get(key);
          req.onsuccess = function() { cb(req.result || null); };
          req.onerror   = function() { cb(null); };
        } catch(e) { cb(null); }
      });
    }

    function set(key, value) {
      open(function(db) {
        if (!db) return;
        try {
          var tx = db.transaction(STORE, 'readwrite');
          tx.objectStore(STORE).put(value, key);
        } catch(e) {}
      });
    }

    return { get: get, set: set };
  })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
</head>
<body>
<div class="bg-liquid"></div>
  <button class="back-btn" onclick="showHome()">&#8592; Back</button>

  <div id="fav-sec" class="content-section" style="display:block" data-color="#ff375f">

    <div class="fav-page-title">&#10084;&#65039; Favourites</div>
    <div class="fav-page-sub"></div>

    <div class="fav-grid"></div>

    <div class="fav-empty" style="display:none">
      <div class="fav-empty-heart">&#9825;</div>
      <h2>No favourites yet</h2>
      <p>Tap the heart on any thumbnail or in the viewer to save it here.</p>
    </div>

    <!-- Video lightbox -->
    <div class="vs-lightbox">
      <div class="vs-backdrop"></div>
      <button class="vs-lb-close">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <button class="vs-lb-prev">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="vs-lb-video-wrap">
        <div class="vs-lb-platter">
          <button class="vs-btn-prev-inline" title="Previous">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
          </button>
          <button class="vs-btn-shuffle" title="Shuffle">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10.59 9.17 5.41 4 4 5.41l5.17 5.17zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4zM14.83 13.41l-1.41 1.41 2.55 2.55L14.5 20H20v-5.5l-2.04 2.04z"/></svg>
          </button>
          <div class="platter-sep"></div>
          <button class="vs-btn-slideshow" title="Slideshow (advance on end)">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          </button>
          <button class="vs-btn-loop" title="Loop">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 7h10v3l4-4-4-4v3H5v6h2zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2z"/></svg>
          </button>
          <button class="vs-btn-auto" title="Auto-advance">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/></svg>
          </button>
          <div class="platter-sep"></div>
          <button class="vs-btn-fullscreen" title="Fullscreen">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
          </button>
          <span class="vs-lb-counter"></span>
        </div>
        <video class="vs-lb-video" controls playsinline></video>
      </div>
      <button class="vs-lb-next">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M9 18l6-6-6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>

    <!-- Image lightbox -->
    <div class="is-lightbox">
      <button class="is-lb-close">&times;</button>
      <button class="is-lb-prev">&#10094;</button>
      <img class="is-lb-img" alt="Photo">
      <button class="is-lb-next">&#10095;</button>
      <div class="is-lb-controls">
        <button class="is-btn-slideshow">&#9654; Play Slideshow</button>
        <span class="is-ss-status"></span>
      </div>
    </div>

    <!-- Hidden scratch video for poster capture -->
    <video class="vs-scratch" muted crossorigin="anonymous" preload="none"></video>

  </div><!-- end #fav-sec -->

  <script src="../vault.js"></script>
  <script>
  (function() {
    var sec     = document.getElementById('fav-sec');
    var grid    = sec.querySelector('.fav-grid');
    var sub     = sec.querySelector('.fav-page-sub');
    var emptyEl = sec.querySelector('.fav-empty');

    // ── Helpers ───────────────────────────────────────────────
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, function(c) {
        return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
      });
    }
    function metaFor(slug) {
      return (window.Favourites && Favourites.META && Favourites.META[slug]) || null;
    }
    function favThumb(url) {
      if (/googleusercontent\.com/.test(url)) return url.replace(/=[^/]+$/, '=w300-h400-c');
      return url;
    }
    function getSrcUrl(url) { return proxyUrl(url); }
    function shuffleArr(arr) {
      for (var i = arr.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
      }
    }

    // Same HLS attach strategy as the collection pages (Safari native / hls.js)
    function attachVideoSrc(videoEl, url) {
      if (videoEl.__hls) { try { videoEl.__hls.destroy(); } catch(e){} videoEl.__hls = null; }
      var isHls = /\.m3u8(\?|$)/i.test(url);
      if (!isHls) { videoEl.src = url; return; }
      if (videoEl.canPlayType('application/vnd.apple.mpegurl')) {
        videoEl.src = url;
      } else if (window.Hls && window.Hls.isSupported()) {
        var hls = new Hls({ maxBufferLength: 30, maxMaxBufferLength: 60 });
        hls.on(Hls.Events.ERROR, function(evt, data) {
          if (!data.fatal) return;
          if (data.type === Hls.ErrorTypes.NETWORK_ERROR) hls.startLoad();
          else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) hls.recoverMediaError();
          else { try { hls.destroy(); } catch(e){} videoEl.__hls = null; }
        });
        hls.loadSource(url);
        hls.attachMedia(videoEl);
        videoEl.__hls = hls;
      } else {
        videoEl.src = url;
      }
    }

    // ── Data ──────────────────────────────────────────────────
    var entries = (window.Favourites ? Favourites.list() : []);
    var vids = [];           // {url,slug,type} video favourites, display order
    var imgs = [];           // image favourites, display order
    var cardByUrl = {};

    function updateSub() {
      var total = vids.length + imgs.length;
      sub.textContent = total ? (total + ' item' + (total === 1 ? '' : 's')) : '';
      emptyEl.style.display = total ? 'none' : 'block';
    }

    // ── Poster capture (cache-first; shares ThumbCache keys) ──
    var scratchVid  = sec.querySelector('.vs-scratch');
    var posterQueue = [];
    var posterBusy  = false;

    function queuePoster(rawUrl, img, card) {
      posterQueue.push({ src: getSrcUrl(rawUrl), img: img, card: card });
      schedulePoster();
    }
    function schedulePoster() { if (!posterBusy) setTimeout(processNextPoster, 0); }

    function applyPoster(job, dataURL) {
      job.img.onload = function() { job.img.style.opacity = '1'; job.card.classList.remove('loading'); };
      job.img.src = dataURL;
    }

    function processNextPoster() {
      if (posterBusy || posterQueue.length === 0) return;
      if (document.hidden) return;
      posterBusy = true;
      var job = posterQueue.shift();
      ThumbCache.get(job.src, function(cached) {
        if (cached) {
          applyPoster(job, cached);
          posterBusy = false;
          setTimeout(processNextPoster, 10);
          return;
        }
        captureThumb(job);
      });
    }

    function captureThumb(job) {
      var src = job.src;
      scratchVid.removeAttribute('crossOrigin');
      scratchVid.removeAttribute('src');
      scratchVid.load();

      var done = false;
      var timer = setTimeout(function(){ finish(null); }, 4000);

      function finish(dataURL) {
        if (done) return;
        done = true;
        clearTimeout(timer);
        if (scratchVid.__hls) { try { scratchVid.__hls.destroy(); } catch(e){} scratchVid.__hls = null; }
        scratchVid.removeEventListener('loadedmetadata', onMeta);
        scratchVid.removeEventListener('seeked', onSeeked);
        scratchVid.removeEventListener('error', onErr);
        scratchVid.removeAttribute('src');
        scratchVid.load();
        if (dataURL) {
          applyPoster(job, dataURL);
          ThumbCache.set(src, dataURL);
        } else {
          job.card.classList.remove('loading');
        }
        posterBusy = false;
        setTimeout(processNextPoster, 120);
      }

      function onMeta()   { scratchVid.currentTime = 0.2; }
      function onErr()    { finish(null); }
      function onSeeked() {
        var vw = scratchVid.videoWidth  || 320;
        var vh = scratchVid.videoHeight || 180;
        var scale = Math.min(1, 320 / vw);
        var canvas = document.createElement('canvas');
        canvas.width  = Math.round(vw * scale);
        canvas.height = Math.round(vh * scale);
        try {
          canvas.getContext('2d').drawImage(scratchVid, 0, 0, canvas.width, canvas.height);
          finish(canvas.toDataURL('image/jpeg', 0.6));
        } catch(e) { finish(null); }
      }

      scratchVid.addEventListener('loadedmetadata', onMeta,   { once: true });
      scratchVid.addEventListener('seeked',         onSeeked, { once: true });
      scratchVid.addEventListener('error',          onErr,    { once: true });
      scratchVid.crossOrigin = 'anonymous';

      var isHls = /\.m3u8(\?|$)/i.test(src);
      if (isHls && !scratchVid.canPlayType('application/vnd.apple.mpegurl')
                && window.Hls && window.Hls.isSupported()) {
        var h = new Hls({ maxBufferLength: 4 });
        h.on(Hls.Events.ERROR, function(e, d) { if (d.fatal) finish(null); });
        h.loadSource(src);
        h.attachMedia(scratchVid);
        scratchVid.__hls = h;
      } else {
        scratchVid.src = src;
        scratchVid.load();
      }
    }

    document.addEventListener('visibilitychange', function() {
      if (!document.hidden) schedulePoster();
    });

    // ── Build the grid ────────────────────────────────────────
    entries.forEach(function(entry) {
      if (!entry || !entry.url) return;
      var isVideo = entry.type === 'video';

      var card = document.createElement('div');
      card.className = 'fav-card' + (isVideo ? ' loading' : '');

      var img = document.createElement('img');
      img.alt = ''; img.decoding = 'async';
      card.appendChild(img);

      if (isVideo) {
        var ov = document.createElement('div');
        ov.className = 'fav-play';
        ov.innerHTML = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
        card.appendChild(ov);
        vids.push(entry);
        card.addEventListener('click', function() { openVideoByUrl(entry.url); });
        queuePoster(entry.url, img, card);
      } else {
        img.src = favThumb(entry.url);
        img.onload = function() { card.classList.remove('loading'); };
        imgs.push(entry);
        card.addEventListener('click', function() { openImageByUrl(entry.url); });
      }

      // Corner heart — carries this favourite's real collection slug
      card.appendChild(Favourites.makeHeart(function() {
        return { url: entry.url, slug: entry.slug, type: entry.type };
      }, { variant: 'tile' }));

      // Collection hyperlink tag
      var m   = metaFor(entry.slug);
      var tag = document.createElement('a');
      tag.className = 'fav-tag';
      tag.href = (entry.slug || '#') + '.html';
      if (m && m.accent) tag.style.setProperty('--accent', m.accent);
      var label = m ? m.label : (entry.slug || 'Unknown');
      var icon  = (m && m.icon) ? m.icon + ' ' : '';
      tag.innerHTML = '<span class="fav-tag-dot"></span>' +
                      '<span class="fav-tag-name">' + escapeHtml(icon + label) + '</span>';
      tag.addEventListener('click', function(ev) { ev.stopPropagation(); });  // navigate, don't open viewer
      card.appendChild(tag);

      grid.appendChild(card);
      cardByUrl[entry.url] = card;
    });
    updateSub();

    // ════════════════════════════════════════════════════════
    //  VIDEO LIGHTBOX
    // ════════════════════════════════════════════════════════
    var vLightbox = sec.querySelector('.vs-lightbox');
    var vBackdrop = vLightbox.querySelector('.vs-backdrop');
    var vClose    = vLightbox.querySelector('.vs-lb-close');
    var vPrev     = vLightbox.querySelector('.vs-lb-prev');
    var vNext     = vLightbox.querySelector('.vs-lb-next');
    var lbVideo   = vLightbox.querySelector('.vs-lb-video');
    var platter   = vLightbox.querySelector('.vs-lb-platter');
    var counter   = vLightbox.querySelector('.vs-lb-counter');
    var btnPrevInline = vLightbox.querySelector('.vs-btn-prev-inline');
    var btnShuffle    = vLightbox.querySelector('.vs-btn-shuffle');
    var btnSlideshow  = vLightbox.querySelector('.vs-btn-slideshow');
    var btnLoop       = vLightbox.querySelector('.vs-btn-loop');
    var btnAuto       = vLightbox.querySelector('.vs-btn-auto');
    var btnFullscreen = vLightbox.querySelector('.vs-btn-fullscreen');

    var vOrder     = vids.map(function(_, i){ return i; });
    var vPos       = 0;
    var vShuffled  = false;
    var vLoop      = false;
    var vAuto      = false;
    var vSlideshow = false;
    var vAutoTimer = null;
    var AUTO_MS    = 12000;

    function vWrap(p) { var n = vOrder.length; return n ? ((p % n) + n) % n : 0; }
    function curVidEntry() { return vOrder.length ? vids[vOrder[vPos]] : null; }
    function vUpdateCounter() {
      counter.textContent = (vPos + 1) + ' / ' + vOrder.length + (vShuffled ? '  🔀' : '');
    }
    function scheduleVAuto() { stopVAuto(); if (vAuto) vAutoTimer = setTimeout(function(){ vShow(vPos + 1); }, AUTO_MS); }
    function stopVAuto() { if (vAutoTimer) { clearTimeout(vAutoTimer); vAutoTimer = null; } }
    function onVEnded() { if (vSlideshow) vShow(vPos + 1); }

    function vShow(p) {
      if (!vOrder.length) { vCloseLightbox(); return; }
      vPos = vWrap(p);
      var e = curVidEntry();
      lbVideo.classList.add('fading');
      setTimeout(function() {
        lbVideo.pause();
        lbVideo.loop = vLoop;
        attachVideoSrc(lbVideo, getSrcUrl(e.url));
        if (!lbVideo.__hls) lbVideo.load();
        lbVideo.removeEventListener('ended', onVEnded);
        if (vSlideshow) lbVideo.addEventListener('ended', onVEnded);
        lbVideo.play().catch(function(){});
        lbVideo.classList.remove('fading');
      }, 300);
      vUpdateCounter();
      if (platterHeart.__refresh) platterHeart.__refresh();
      scheduleVAuto();
    }

    function openVideoByUrl(url) {
      var idx = -1;
      for (var i = 0; i < vids.length; i++) { if (vids[i].url === url) { idx = i; break; } }
      if (idx < 0) return;
      vLightbox.style.display = 'flex';
      vShow(vOrder.indexOf(idx));
    }

    function vCloseLightbox() {
      vLightbox.style.display = 'none';
      lbVideo.pause();
      lbVideo.removeEventListener('ended', onVEnded);
      if (lbVideo.__hls) { try { lbVideo.__hls.destroy(); } catch(e){} lbVideo.__hls = null; }
      lbVideo.removeAttribute('src');
      lbVideo.load();
      stopVAuto();
    }

    // Platter favourite heart (right end) — controls the current video
    var platterHeart = Favourites.makeHeart(function() {
      var e = curVidEntry();
      return e ? { url: e.url, slug: e.slug, type: 'video' } : null;
    }, { variant: 'inline' });
    var pSep = document.createElement('div'); pSep.className = 'platter-sep';
    platter.appendChild(pSep);
    platter.appendChild(platterHeart);

    vBackdrop.onclick = vCloseLightbox;
    vClose.onclick    = vCloseLightbox;
    vPrev.onclick     = function() { stopVAuto(); vShow(vPos - 1); };
    vNext.onclick     = function() { stopVAuto(); vShow(vPos + 1); };
    btnPrevInline.onclick = function() { stopVAuto(); vShow(vPos - 1); };

    btnShuffle.onclick = function() {
      vShuffled = !vShuffled;
      var cur = vOrder.length ? vOrder[vPos] : 0;
      vOrder = vids.map(function(_, i){ return i; });
      if (vShuffled) shuffleArr(vOrder);
      vPos = vOrder.indexOf(cur); if (vPos < 0) vPos = 0;
      btnShuffle.classList.toggle('active', vShuffled);
      vUpdateCounter();
    };
    btnLoop.onclick = function() {
      vLoop = !vLoop; lbVideo.loop = vLoop;
      btnLoop.classList.toggle('active', vLoop);
    };
    btnSlideshow.onclick = function() {
      vSlideshow = !vSlideshow;
      btnSlideshow.classList.toggle('active', vSlideshow);
      lbVideo.removeEventListener('ended', onVEnded);
      if (vSlideshow) { vLoop = false; lbVideo.loop = false; btnLoop.classList.remove('active'); lbVideo.addEventListener('ended', onVEnded); }
    };
    btnAuto.onclick = function() {
      vAuto = !vAuto;
      btnAuto.classList.toggle('active', vAuto);
      if (vAuto) scheduleVAuto(); else stopVAuto();
    };
    btnFullscreen.onclick = function() {
      var wrap = vLightbox.querySelector('.vs-lb-video-wrap');
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        (wrap.requestFullscreen || wrap.webkitRequestFullscreen || function(){}).call(wrap);
      } else {
        (document.exitFullscreen || document.webkitExitFullscreen || function(){}).call(document);
      }
    };

    // ════════════════════════════════════════════════════════
    //  IMAGE LIGHTBOX
    // ════════════════════════════════════════════════════════
    var iLightbox = sec.querySelector('.is-lightbox');
    var iClose    = iLightbox.querySelector('.is-lb-close');
    var iPrev     = iLightbox.querySelector('.is-lb-prev');
    var iNext     = iLightbox.querySelector('.is-lb-next');
    var lbImg     = iLightbox.querySelector('.is-lb-img');
    var iControls = iLightbox.querySelector('.is-lb-controls');
    var ssBtn     = iLightbox.querySelector('.is-btn-slideshow');
    var ssStatus  = iLightbox.querySelector('.is-ss-status');
    var iIdx      = 0;
    var iSsActive = false;
    var iSsTimer  = null;
    var IMG_MS    = 5000;

    function iShow(i) {
      if (!imgs.length) { iCloseLightbox(); return; }
      if (iSsTimer) { clearTimeout(iSsTimer); iSsTimer = null; }
      iIdx = ((i % imgs.length) + imgs.length) % imgs.length;
      lbImg.style.opacity = '0';
      lbImg.src = '';
      lbImg.src = imgs[iIdx].url;
      lbImg.onload = function() {
        lbImg.style.opacity = '1';
        if (iSsActive) {
          ssStatus.textContent = '⏱ ' + (IMG_MS / 1000).toFixed(1) + 's';
          iSsTimer = setTimeout(function(){ iShow(iIdx + 1); }, IMG_MS);
        }
      };
      if (imgHeart.__refresh) imgHeart.__refresh();
    }
    function openImageByUrl(url) {
      var idx = -1;
      for (var i = 0; i < imgs.length; i++) { if (imgs[i].url === url) { idx = i; break; } }
      if (idx < 0) return;
      iLightbox.style.display = 'flex';
      iShow(idx);
    }
    function iCloseLightbox() {
      iLightbox.style.display = 'none';
      lbImg.removeAttribute('src');
      iStopSlideshow();
    }
    function iStopSlideshow() {
      iSsActive = false;
      if (iSsTimer) { clearTimeout(iSsTimer); iSsTimer = null; }
      ssBtn.innerHTML = '&#9654; Play Slideshow';
      ssStatus.textContent = '';
    }
    function iStartSlideshow() {
      iSsActive = true;
      ssBtn.innerHTML = '&#9724; Stop';
      iShow(iIdx);
    }

    // Image-controls favourite heart (right end)
    var imgHeart = Favourites.makeHeart(function() {
      var e = imgs[iIdx];
      return e ? { url: e.url, slug: e.slug, type: 'image' } : null;
    }, { variant: 'inline' });
    iControls.appendChild(imgHeart);

    iClose.onclick = iCloseLightbox;
    iPrev.onclick  = function() { iStopSlideshow(); iShow(iIdx - 1); };
    iNext.onclick  = function() { iStopSlideshow(); iShow(iIdx + 1); };
    ssBtn.onclick  = function() { iSsActive ? iStopSlideshow() : iStartSlideshow(); };
    iLightbox.addEventListener('click', function(e) { if (e.target === iLightbox) iCloseLightbox(); });

    // ── Keyboard ──────────────────────────────────────────────
    document.addEventListener('keydown', function(e) {
      if (vLightbox.style.display === 'flex') {
        if (e.key === 'Escape') vCloseLightbox();
        else if (e.key === 'ArrowLeft')  { stopVAuto(); vShow(vPos - 1); }
        else if (e.key === 'ArrowRight') { stopVAuto(); vShow(vPos + 1); }
      } else if (iLightbox.style.display === 'flex') {
        if (e.key === 'Escape') iCloseLightbox();
        else if (e.key === 'ArrowLeft')  { iStopSlideshow(); iShow(iIdx - 1); }
        else if (e.key === 'ArrowRight') { iStopSlideshow(); iShow(iIdx + 1); }
      }
    });

    // ── Removal: when anything is un-favourited, drop its card ──
    document.addEventListener('vault-fav-change', function(ev) {
      if (!ev.detail || ev.detail.state !== false || !ev.detail.url) return;
      var url = ev.detail.url;

      var vi = -1, ii = -1, k;
      for (k = 0; k < vids.length; k++) { if (vids[k].url === url) { vi = k; break; } }
      for (k = 0; k < imgs.length; k++) { if (imgs[k].url === url) { ii = k; break; } }

      if (vi >= 0) {
        var wasCurrentV = (vLightbox.style.display === 'flex' && curVidEntry() && curVidEntry().url === url);
        vids.splice(vi, 1);
        vOrder = vids.map(function(_, i){ return i; });
        if (vShuffled) shuffleArr(vOrder);
        if (wasCurrentV) {
          if (vids.length) vShow(Math.min(vPos, vOrder.length - 1));
          else vCloseLightbox();
        }
      }
      if (ii >= 0) {
        var wasCurrentI = (iLightbox.style.display === 'flex' && imgs[iIdx] && imgs[iIdx].url === url);
        imgs.splice(ii, 1);
        if (wasCurrentI) {
          if (imgs.length) iShow(Math.min(iIdx, imgs.length - 1));
          else iCloseLightbox();
        }
      }

      var card = cardByUrl[url];
      if (card && card.parentNode) card.parentNode.removeChild(card);
      delete cardByUrl[url];
      updateSub();
    });
  })();
  </script>
</body>
